name: "Update Korean TV M3U Playlist"

on:
  schedule:
    - cron: '0 19 * * *'  # 中国时间次日03:00（计划时间）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_playlist.py'
      - '.github/workflows/update_playlist.yml'

permissions:
  contents: write

concurrency:
  group: korean-tv-playlist-main
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check browser environment
        run: |
          python --version
          google-chrome --version
          chromedriver --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests selenium beautifulsoup4 webdriver-manager

      - name: Run update script
        env:
          FULL_ACCESS_TOKEN: ${{ secrets.FULL_ACCESS_TOKEN }}
        run: |
          # 删除工作区中的旧文件，避免脚本失败后误用旧列表
          rm -f korean_tv.m3u
          python update_playlist.py
          test -s korean_tv.m3u
          grep -q '^#EXTM3U' korean_tv.m3u
          grep -q '^#EXTINF:' korean_tv.m3u

      - name: Upload playlist as artifact
        uses: actions/upload-artifact@v6
        with:
          name: korean-tv-playlist
          path: korean_tv.m3u
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push to GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -- korean_tv.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Auto-update playlist - $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Sync to GitHub static repository
        env:
          FULL_ACCESS_TOKEN: ${{ secrets.FULL_ACCESS_TOKEN }}
        run: |
          if [ -z "$FULL_ACCESS_TOKEN" ]; then
            echo "::warning::FULL_ACCESS_TOKEN is not set; skipping static GitHub repository."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from update_playlist import update_stable_repository
          content = Path('korean_tv.m3u').read_text(encoding='utf-8')
          if not update_stable_repository(content):
              raise SystemExit('Static GitHub repository update failed.')
          PY

      - name: Sync playlist to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USERNAME" ]; then
            echo "::warning::Gitee credentials are missing; skipping Gitee sync."
            exit 0
          fi
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          export GIT_ASKPASS="$tmp_dir/askpass.sh"
          cat > "$GIT_ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *) printf '%s\n' "$GITEE_TOKEN" ;;
          esac
          SH
          chmod 700 "$GIT_ASKPASS"
          git -c credential.helper= clone --depth 1 --branch main \
            "https://gitee.com/${GITEE_USERNAME}/korean-tv-static.git" "$tmp_dir/repo"
          cp korean_tv.m3u "$tmp_dir/repo/korean_tv.m3u"
          git -C "$tmp_dir/repo" config user.email "action@github.com"
          git -C "$tmp_dir/repo" config user.name "GitHub Action"
          git -C "$tmp_dir/repo" add -- korean_tv.m3u
          if git -C "$tmp_dir/repo" diff --cached --quiet; then
            echo "No Gitee playlist changes."
          else
            git -C "$tmp_dir/repo" commit -m "Auto-update playlist - $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git -C "$tmp_dir/repo" -c credential.helper= push origin main
          fi
